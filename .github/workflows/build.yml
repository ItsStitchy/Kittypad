name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |

          REPO_DIR="$(pwd)"


          git clone --depth 1 https://github.com/qmk/qmk_firmware.git /opt/qmk_firmware
          cd /opt/qmk_firmware

          qmk setup -y


          mkdir -p keyboards/kittypad/keymaps/default


          cp "$REPO_DIR"/firmware/info.json keyboards/kittypad/
          cp "$REPO_DIR"/firmware/config.h keyboards/kittypad/ 2>/dev/null || true
          cp "$REPO_DIR"/firmware/rules.mk keyboards/kittypad/ 2>/dev/null || true
          cp "$REPO_DIR"/firmware/keymap.c keyboards/kittypad/keymaps/default/


          qmk compile -kb kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: /opt/qmk_firmware/*.uf2
