name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Setup QMK Environment
        run: |
          cd qmk_firmware
          qmk setup -y

      - name: Checkout User Repository into QMK Keyboards
        uses: actions/checkout@v4
        with:
          path: qmk_firmware/keyboards/kittypad

      - name: Structure Firmware Directory
        run: |
          cd qmk_firmware/keyboards/kittypad
          
          # Move files from firmware/ folder to keyboard root if present
          if [ -d "firmware" ]; then
            cp -r firmware/* .
          fi
          
          # Create default keymap directory and move keymap file
          mkdir -p keymaps/default
          if [ -f "keymap.c" ]; then
            cp keymap.c keymaps/default/
          fi

      - name: Build Firmware
        run: |
          cd qmk_firmware
          qmk compile -kb kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: qmk_firmware/*.uf2
