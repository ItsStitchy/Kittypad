name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          # 1. Clone QMK Firmware
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          qmk setup -y

          # 2. Build keyboard directory structure inside QMK
          mkdir -p keyboards/kittypad/keymaps/default

          # 3. Copy firmware files from parent repo into QMK
          cp ../firmware/info.json keyboards/kittypad/ 2>/dev/null || true
          cp ../firmware/config.h keyboards/kittypad/ 2>/dev/null || true
          cp ../firmware/rules.mk keyboards/kittypad/ 2>/dev/null || true
          cp ../firmware/keymap.c keyboards/kittypad/keymaps/default/

          # 4. Compile .uf2 file
          qmk compile -kb kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: qmk_firmware/*.uf2
