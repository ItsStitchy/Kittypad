name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          REPO_DIR="$GITHUB_WORKSPACE"

          # 1. Clone QMK
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git /opt/qmk_firmware
          cd /opt/qmk_firmware
          qmk setup -y

          # 2. Create keyboard path
          mkdir -p keyboards/handwired/kittypad/keymaps/default

          # 3. Copy files from workspace
          cp "$REPO_DIR"/firmware/info.json keyboards/handwired/kittypad/
          cp "$REPO_DIR"/firmware/config.h keyboards/handwired/kittypad/ 2>/dev/null || true
          cp "$REPO_DIR"/firmware/keymap.c keyboards/handwired/kittypad/keymaps/default/

          # 4. Inject strict RP2040 build variables into rules.mk
          cat << 'EOF' > keyboards/handwired/kittypad/rules.mk
          MCU = RP2040
          BOOTLOADER = rp2040
          ENCODER_ENABLE = yes
          RGBLIGHT_ENABLE = yes
          EOF

          # 5. Compile target
          qmk compile -kb handwired/kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: /opt/qmk_firmware/*.uf2
