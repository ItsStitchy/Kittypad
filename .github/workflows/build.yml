name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Setup Custom Keyboard Structure
        run: |
          # Create QMK folder paths for kittypad
          mkdir -p qmk_firmware/keyboards/kittypad/keymaps/default
          
          # Move base keyboard config files (info.json, config.h, rules.mk)
          cp user_repo/firmware/info.json qmk_firmware/keyboards/kittypad/ 2>/dev/null || true
          cp user_repo/firmware/config.h qmk_firmware/keyboards/kittypad/ 2>/dev/null || true
          cp user_repo/firmware/rules.mk qmk_firmware/keyboards/kittypad/ 2>/dev/null || true
          
          # Move keymap file into the default keymap directory
          cp user_repo/firmware/keymap.c qmk_firmware/keyboards/kittypad/keymaps/default/

      - name: Build Firmware
        run: |
          cd qmk_firmware
          qmk compile -kb kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: qmk_firmware/*.uf2
