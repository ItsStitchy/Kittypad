name: Build QMK Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          # Clone QMK
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git /opt/qmk_firmware
          cd /opt/qmk_firmware
          qmk setup -y

          # Create handwired folder
          mkdir -p keyboards/handwired/kittypad/keymaps/default

          # Copy repo firmware files
          cp "$GITHUB_WORKSPACE"/firmware/info.json keyboards/handwired/kittypad/
          cp "$GITHUB_WORKSPACE"/firmware/config.h keyboards/handwired/kittypad/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/firmware/rules.mk keyboards/handwired/kittypad/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/firmware/keymap.c keyboards/handwired/kittypad/keymaps/default/

          # Force target compile
          qmk compile -kb handwired/kittypad -km default

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kittypad_firmware
          path: /opt/qmk_firmware/*.uf2
